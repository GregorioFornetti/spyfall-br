# Render Blueprint — game server only.
# The admin server (backend/src/admServer.js) is deliberately NOT deployed:
# it has no authentication, so it should only run locally when needed
# (see README). The game server reads places/roles/categories from the
# committed JSON files in backend/data and rejects writes with 405.
services:
  - type: web
    name: spyfall-br
    runtime: node
    plan: free
    buildCommand: cd frontend/spyfall-br-game && npm install && npm run build && cd ../../backend && npm install --omit=dev
    startCommand: cd backend && node src/index.js
    healthCheckPath: /spyfall
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # Render provides PORT automatically; do not set it here.
      - key: GAME_PATH
        value: /spyfall
      - key: DB_PATH
        value: /spyfall/db
      - key: ADM_PATH
        value: /spyfall/adm
      # Inlined into the frontend bundle at build time.
      - key: PUBLIC_URL
        value: /spyfall
      - key: REACT_APP_DB_PATH
        value: /spyfall/db
