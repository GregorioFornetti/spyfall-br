# Render Blueprint — game server only, Docker (same image as docker-compose).
# The admin server (backend/src/admServer.js) is deliberately NOT deployed:
# it has no authentication, so it should only run locally when needed
# (see README). The game server reads places/roles/categories from the
# committed JSON files in backend/data and rejects writes with 405.
services:
  - type: web
    name: spyfall-br
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfiles/server.Dockerfile
    dockerContext: .
    # The Dockerfile's CMD already does this; kept explicit because
    # docker-compose is what used to override the old broken CMD.
    dockerCommand: cd /home/node/app/backend && node src/index.js
    healthCheckPath: /spyfall
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render passes envVars to Docker as build args. These keys must
      # match the Dockerfile ARG names (lowercase) so PUBLIC_URL and
      # REACT_APP_DB_PATH are baked into the frontend bundle.
      - key: game_path
        value: /spyfall
      - key: db_path
        value: /spyfall/db
      # Runtime config for the backend. Render provides PORT; do not set it.
      - key: GAME_PATH
        value: /spyfall
      - key: DB_PATH
        value: /spyfall/db
      - key: ADM_PATH
        value: /spyfall/adm
