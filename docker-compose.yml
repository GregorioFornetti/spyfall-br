version: "3"
services:
  server:
    container_name: server
    build:
      context: .
      dockerfile: ./Dockerfiles/server.Dockerfile
      args:
        game_path: ${GAME_PATH}
        db_path: ${DB_PATH}
    command: "npm run server"
    working_dir: /home/node/app/backend
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      GAME_PATH: ${GAME_PATH}
      DB_PATH: ${DB_PATH}
    expose:
      - "${PORT}"
    ports:
      - "${PORT}:${PORT}"
    restart: always
    volumes:
      - ./backend/placeImgs:/home/node/app/backend/placeImgs
      - ./backend/data:/home/node/app/backend/data
  adm:
    container_name: adm
    profiles:
      - adm
    build:
      context: .
      dockerfile: ./Dockerfiles/adm.Dockerfile
      args:
        adm_path: ${ADM_PATH}
        db_path: ${DB_PATH}
    command: "npm run adm"
    working_dir: /home/node/app/backend
    environment:
      NODE_ENV: ${NODE_ENV}
      ADM_PORT: ${ADM_PORT}
      ADM_PATH: ${ADM_PATH}
      DB_PATH: ${DB_PATH}
    expose:
      - "${ADM_PORT}"
    ports:
      - "${ADM_PORT}:${ADM_PORT}"
    volumes:
      - ./backend/placeImgs:/home/node/app/backend/placeImgs
      - ./backend/data:/home/node/app/backend/data
